name: Build and publish site

# Cloudflare Pages is the publication destination — it serves both live custom
# domains. GitHub Pages is a preview of the same build at dakibwa.github.io and
# is not what visitors see. Both deploy from one build so the preview cannot
# drift from what actually shipped.
#
# Before this workflow existed, publishing meant remembering to run
# `npm run deploy:cloudflare` by hand after merging. Pushing to main updated
# only the preview, which is easy to mistake for a completed release: the
# commit is on main, Actions is green, and the live site is still the old one.

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Booking is served by the ines-booking Worker. The check:booking step
      # below fails the build if it is missing or unhealthy, so a release can
      # never quietly ship a dead calendar.
      NEXT_PUBLIC_BOOKING_API_BASE_URL: ${{ vars.NEXT_PUBLIC_BOOKING_API_BASE_URL }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      # Public by design: it identifies the app, and the Worker verifies every
      # Google token against it. Absent simply hides the Google button.
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
      LESSON_PRICE_CENTS: ${{ vars.LESSON_PRICE_CENTS || '2500' }}
      LESSON_CURRENCY: ${{ vars.LESSON_CURRENCY || 'eur' }}
      NEXT_PUBLIC_LESSON_DURATION_MINUTES: ${{ vars.NEXT_PUBLIC_LESSON_DURATION_MINUTES || '60' }}
      NEXT_PUBLIC_SAME_DAY_RESCHEDULE_FEE_CENTS: ${{ vars.NEXT_PUBLIC_SAME_DAY_RESCHEDULE_FEE_CENTS || '500' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release check
        run: npm run check:release

      # The journey test only ever ran locally, so its selectors rotted through
      # several commits while CI stayed green — the booking page had been
      # renamed and nothing noticed. It runs against the built export here, so
      # a broken customer journey blocks the release rather than shipping.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check Akibwa portfolio entry
        run: npm run test:portfolio-banner

      - name: Check customer journeys against the built site
        run: |
          # localhost, not 127.0.0.1: the browser sends the host it was given as
          # the Origin, and the Worker's allow-list carries localhost:3000. Using
          # the raw IP meant every API call was refused by CORS, so the booking
          # page rendered with no lesson types.
          python3 -m http.server 3000 --bind 127.0.0.1 --directory out &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in $(seq 1 20); do
            curl -sf http://localhost:3000/ > /dev/null && break
            sleep 1
          done
          QA_BASE_URL=http://localhost:3000 npm run test:flow

      # Two uploads of one build: the Pages-shaped tarball for the preview, and
      # the plain directory the Cloudflare deploy needs. Hidden files are kept
      # because the export carries dotfiles the deploy would otherwise lose;
      # _headers is not one of them, but it does have to survive the round trip,
      # since it is the whole cache policy.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Upload build for Cloudflare
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: out
          include-hidden-files: true
          retention-days: 1

  publish-cloudflare:
    name: Publish to Cloudflare Pages (live)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check Cloudflare credentials are configured
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "The live domains are served by Cloudflare Pages, so without these"
            echo "the site does not publish. Add them under Settings > Secrets and"
            echo "variables > Actions, then re-run this workflow."
            exit 1
          fi

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=portuguese-with-ines --branch=main

  deploy-preview:
    name: Deploy preview to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
