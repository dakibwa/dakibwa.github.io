name: Ensure www DNS once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ensure-www:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Create the exact Pages CNAME when absent
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const zoneId = "81f04c2b750a588df502648ecf6710b3";
          const recordName = "www.portuguesewithines.com";
          const recordTarget = "portuguese-with-ines.pages.dev";
          const endpoint = `https://api.cloudflare.com/client/v4/zones/${zoneId}/dns_records`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            "Content-Type": "application/json"
          };

          const readResponse = await fetch(`${endpoint}?name=${recordName}`, { headers });
          const readBody = await readResponse.json();
          if (!readResponse.ok || !readBody.success) {
            throw new Error(`DNS lookup failed (${readResponse.status}): ${JSON.stringify(readBody.errors ?? [])}`);
          }

          const records = readBody.result ?? [];
          if (records.length > 1) {
            throw new Error(`Refusing to change ${records.length} existing www records.`);
          }

          if (records.length === 1) {
            const record = records[0];
            if (
              record.type !== "CNAME" ||
              record.name !== recordName ||
              record.content !== recordTarget ||
              record.proxied !== true
            ) {
              throw new Error(
                `Refusing to replace conflicting www record: ${JSON.stringify({
                  type: record.type,
                  name: record.name,
                  content: record.content,
                  proxied: record.proxied
                })}`
              );
            }
            console.log("The exact proxied www Pages CNAME already exists.");
            process.exit(0);
          }

          const createResponse = await fetch(endpoint, {
            method: "POST",
            headers,
            body: JSON.stringify({
              type: "CNAME",
              name: recordName,
              content: recordTarget,
              proxied: true,
              ttl: 1,
              comment: "Portuguese with Ines Pages www custom domain"
            })
          });
          const createBody = await createResponse.json();
          if (!createResponse.ok || !createBody.success) {
            throw new Error(`DNS creation failed (${createResponse.status}): ${JSON.stringify(createBody.errors ?? [])}`);
          }

          const created = createBody.result;
          if (
            created?.type !== "CNAME" ||
            created?.name !== recordName ||
            created?.content !== recordTarget ||
            created?.proxied !== true
          ) {
            throw new Error("Cloudflare did not return the requested proxied www CNAME.");
          }
          console.log("Created the exact proxied www Pages CNAME.");
          NODE
